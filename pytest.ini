[pytest]
# UI (tests/), API (tests_api/) y la suite BDD de Behave (tests_behave/)
testpaths = tests tests_api tests_behave
pythonpath = .
# Cada corrida deja el reporte en reports/report.html (un solo archivo, con CSS e imágenes adentro)
addopts = -v --html=reports/report.html --self-contained-html
markers =
    smoke: pruebas rápidas de lo básico (en CI corren primero; si fallan, se corta)
    regression: pruebas de regresión (más completas)
    api: pruebas de API (sin navegador)
    e2e: flujos completos de punta a punta (varios pasos encadenados)
    bdd: escenarios Gherkin ejecutados con Behave
