[behave]
# Palabras clave de Gherkin en español (Característica, Escenario, Dado, Cuando, Entonces...)
lang = es
# Dónde están los .feature
paths = features
# Por defecto no corre lo que está en desarrollo (@wip)
default_tags = not @wip
# No mostrar los escenarios que quedaron afuera por el filtro de tags
show_skipped = false

# Registra el formato "html" del paquete behave-html-formatter
[behave.formatters]
html = behave_html_formatter:HTMLFormatter
